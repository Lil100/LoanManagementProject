server:
  port: 8081

spring:
  application:
    name: loanmanagement

  datasource:
    url: jdbc:mariadb://localhost:3306/loan_management_db
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true

security:
  jwt:
    secret: mysecretkey12345678901234567890123
    expirationMs: 86400000

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
